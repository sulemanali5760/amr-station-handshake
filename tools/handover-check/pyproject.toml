[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "handover-check"
version = "0.2.0"
description = "Test a conveyor station's AMR/AGV load-handover handshake over OPC UA before the robot arrives: plays the vehicle side, also the ways a vehicle fails, and reports rule by rule."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Suleman Ali" }]
keywords = ["agv", "amr", "plc", "opc-ua", "handshake", "commissioning", "conveyor", "vda5050", "intralogistics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = ["asyncua>=1.1,<3", "pyyaml>=6.0"]

[project.urls]
Repository = "https://github.com/sulemanali5760/amr-station-handshake"

[project.scripts]
handover-check = "handover_check.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
