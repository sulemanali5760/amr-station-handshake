name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y python3-pip
          rosdep update --rosdistro jazzy
          rosdep install --from-paths src --ignore-src --rosdistro jazzy -y
          # asyncua is not packaged for rosdep. --ignore-installed keeps pip from
          # trying to upgrade apt-owned packages it cannot uninstall.
          pip install --break-system-packages --ignore-installed asyncua==2.0.1

      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_direct+

      - name: Test (unit, lint, end-to-end)
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_direct+ --return-code-on-test-failure
          colcon test-result --verbose

  plc-files:
    # TwinCAT cannot run here; check that the PLC files are well-formed and free of
    # a doubled quote inside a string (compiles in XAE, but ends the string early).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: TwinCAT object files
        run: |
          python3 - <<'EOF'
          import pathlib, re, sys, xml.etree.ElementTree as ET
          bad = 0
          for f in sorted(pathlib.Path("plc/twincat").glob("*.Tc*")):
              ET.parse(f)
              for n, line in enumerate(f.read_text(encoding="utf-8").splitlines(), 1):
                  if re.search(r"\w''\w", line.split("//")[0]):
                      print(f"::error::{f}:{n}: '' inside a string; write $' for an apostrophe"); bad += 1
              print("ok", f)
          sys.exit(1 if bad else 0)
          EOF

  handover-check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: tools/handover-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt -e .
      - name: Tester against the reference station, conforming and with each defect
        run: python -m pytest -v
      - name: Known vulnerabilities in dependencies
        run: python -m pip_audit -r requirements-dev.txt

  codespaces-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the Codespaces image
        run: docker build -f .devcontainer/Dockerfile .devcontainer
